# Pubblica una release, in due modi:
# - inviando un tag di versione (es. v1.2.0) dal computer;
# - da GitHub, senza computer: Actions → Release → Run workflow (sul branch main). Il tag lo crea l'automazione
#   leggendo la "Version" del plugin, e si ferma se quella versione è già stata pubblicata.
# In entrambi i casi controlla la versione, crea lo zip e lo allega alla release con le note del CHANGELOG.
# I siti con il plugin installato vedono l'aggiornamento in Bacheca → Aggiornamenti (entro 6 ore, o subito con "Controlla di nuovo").
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Controllo versione
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 -E '^\s*\*\s*Version:' lu3g-mobile-menu.php | awk '{print $NF}')
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            [ "${GITHUB_REF_NAME}" = "main" ] || { echo "Avvia il workflow dal branch main (ora: ${GITHUB_REF_NAME})"; exit 1; }
            if gh release view "v$v" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
              echo "La versione $v è già pubblicata: aumenta la Version del plugin prima di rilasciare"; exit 1
            fi
            tag="v$v"
          else
            tag="${GITHUB_REF_NAME}"
            [ "v$v" = "$tag" ] || { echo "Tag $tag diverso dalla Version del plugin ($v)"; exit 1; }
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Pacchetto
        run: sh bin/build.sh
      - name: Note dal CHANGELOG
        run: |
          v=${TAG#v}
          awk -v v="$v" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Versione $v" > notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/lu3g-mobile-menu.zip --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
